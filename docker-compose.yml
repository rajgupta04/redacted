services:
  pii-redactor:
    build: .
    image: piiredactor.azurecr.io/pii-redactor:latest
    container_name: pii_redactor_app
    ports:
      - "80:80"
    environment:
      - PORT=80
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/')"]
      interval: 30s
      timeout: 15s
      retries: 3
    volumes:
      - ./tmp:/tmp
